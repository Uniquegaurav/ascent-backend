# Render Blueprint — provisions the API (Docker) + a managed Postgres and wires them.
# Deploy: render.com → New → Blueprint → connect this repo → Apply.

databases:
  - name: ascent-db
    plan: free
    databaseName: ascent
    user: ascent

services:
  - type: web
    name: ascent-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ascent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Silent dev backdoor OTP (no UI hint). Real per-phone codes also work.
      - key: OTP_DEV_CODE
        value: "111111"
      - key: ACCESS_TOKEN_TTL
        value: "1h"
      - key: REFRESH_TOKEN_TTL
        value: "2160h"
