# Render Blueprint — provisions the API (Docker) + a managed Postgres and wires them.
# Deploy: render.com → New → Blueprint → connect this repo → Apply.

databases:
  - name: ascent-db
    plan: free
    databaseName: ascent
    user: ascent

services:
  - type: web
    name: ascent-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ascent-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEV_CODE
        value: "000000"
